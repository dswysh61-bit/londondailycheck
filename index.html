    function stripHtml(h) {
      return (h||"").replace(/<[^>]*>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/&quot;/g,'"').trim();
    }

    function timeAgo(d) {
      try {
        const h = Math.floor((Date.now()-new Date(d))/3600000);
        if (h<1) return "לפני פחות משעה";
        if (h<24) return `לפני ${h} שעות`;
        return `לפני ${Math.floor(h/24)} ימים`;
      } catch { return ""; }
    }

    function score(text) {
      const t=(text||"").toLowerCase();
      const protest=["protest","demonstration","march","rally","demo","vigil","activists","ceasefire"].some(k=>t.includes(k));
      const topic=["palestine","palestinian","gaza","israel","west bank","hamas","rafah","jenin"].some(k=>t.includes(k));
      const london=["london","westminster","uk ","britain","british","trafalgar","downing"].some(k=>t.includes(k));
      if(topic&&protest&&london) return 3;
      if(topic&&protest) return 2;
      if(topic) return 1;
      return 0;
    }

    async function fetchFeed(feed, urlIdx=0, attempt=0) {
      const url = feed.urls[urlIdx];
      try {
        const r = await fetch(url, { signal: AbortSignal.timeout(13000) });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        if (data.status !== "ok") throw new Error(data.message || "RSS שגיאה");
        return { ok:true, items: data.items||[], feed };
      } catch(e) {
        if (attempt < 1) {
          await new Promise(r=>setTimeout(r,700*(attempt+1)));
          return fetchFeed(feed, urlIdx, attempt+1);
        }
        if (urlIdx + 1 < feed.urls.length) {
          return fetchFeed(feed, urlIdx+1, 0);
        }
        return { ok:false, error: e.message, feed };
      }
    }

      }

    function App() {
      const [tab,      setTab]      = useState(0);
      const [loading,  setLoading]  = useState(false);
      const [news,     setNews]     = useState(null);
      const [isFallback, setIsFallback] = useState(false);
      const [errors,   setErrors]   = useState([]);
      const [filter,   setFilter]   = useState("הכל");
      const [updated,  setUpdated]  = useState(null);
      const [logs,     setLogs]     = useState([]);

      const fetchNews = useCallback(async () => {
        setLoading(true);
        setErrors([]);
        setIsFallback(false);

        try {
          const c = localStorage.getItem("hub_news_he");
          if (c) {
            const { data, ts } = JSON.parse(c);
            if (Date.now()-ts < 5*60*1000 && data?.length > 0) {
              setNews(data);
              setUpdated(new Date(ts).toLocaleTimeString("he-IL"));
              setLogs(["✓ נטען מהמטמון (פחות מ-5 דקות)"]);
              setLoading(false);
              return;
            }
          }
        } catch {}

        const newLogs = [];
        const errs    = [];
        const found   = [];

        const results = await Promise.all(FEEDS.map(f => fetchFeed(f)));

        results.forEach(res => {
          if (res.ok) {
            let matched = 0;
            (res.items||[]).forEach(item => {
              const combined = (item.title||"") + " " + stripHtml(item.description||"");
              const s = score(combined);
              if (s > 0) {
                matched++;
                found.push({
                  title:  item.title || "ללא כותרת",
                  desc:   stripHtml(item.description||"").slice(0,200),
                  link:   item.link || "#",
                  date:   item.pubDate || new Date().toISOString(),
                  source: res.feed.name,
                  color:  res.feed.color,
                  score:  s,
                });
              }
            });
            newLogs.push(`✓ ${res.feed.name}: ${res.items.length} פריטים · ${matched} רלוונטיים`);
          } else {
            errs.push(res.feed.name + ": " + res.error);
            newLogs.push(`✗ ${res.feed.name}: ${res.error}`);
          }
        });

        found.sort((a,b) => b.score-a.score || new Date(b.date)-new Date(a.date));

        setLogs(newLogs);
        setErrors(errs);

        const ts = Date.now();
        if (found.length > 0) {
          setNews(found);
          setIsFallback(false);
          setUpdated(new Date(ts).toLocaleTimeString("he-IL"));
          try { localStorage.setItem("hub_news_he", JSON.stringify({ data:found, ts })); } catch {}
        } else {
          setNews(FALLBACK);
          setIsFallback(true);
          setUpdated(new Date(ts).toLocaleTimeString("he-IL"));
        }

        setLoading(false);
      }, []);

      useEffect(()=>{ fetchNews(); }, [fetchNews]);

      const FILTER_OPTS = ["הכל", ...FEEDS.map(f=>f.name)];
      const shown = filter==="הכל" ? news : news?.filter(n=>n.source===filter);
      const today = new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

      return (
        <ErrorBoundary>
          <style>{CSS}</style>
          <div dir="rtl" style={{minHeight:"100vh",background:"#080909",color:"#f0ede6"}}>

            <div className="bar">
              <div className="logo">מרכז המעקב · לונדון</div>
              <div className="bar-left">
                <div className="bar-date">{today}</div>
                <div className="live"><span className="live-dot"/>חי</div>
              </div>
            </div>

            <div className="hero">
              <div className="hero-tag">// מעקב יומי // לונדון // בריטניה</div>
              <h1 className="hero-h1">הפגנות <span>פרו-פלסטיניות</span><br/>בלונדון</h1>
              <p className="hero-sub">אגרגטור חדשות ואירועים בזמן אמת — Al Jazeera, BBC, Guardian, Independent ועוד</p>
            </div>

            <div className="tabs">
              {["חדשות","אירועים","אינסטגרם"].map((t,i)=>(
                <button key={i} className={`tab${tab===i?" on":""}`} onClick={()=>setTab(i)}>{t}</button>
              ))}
            </div>

            <div className="page">
              <ErrorBoundary>

                {tab===0 && <>
                  <div className="sec-h">
                    <div className="sec-title">חדשות עדכניות</div>
                    {news && <div className="sec-count">{shown?.length||0} כתבות</div>}
                  </div>

                  <div className="toolbar">
                    <div className="toolbar-r">
                      <button className="refresh" onClick={fetchNews} disabled={loading}>
                        {loading ? <>
                          <svg width="14" height="14" viewBox="0 0 14 14" style={{animation:"spin .7s linear infinite",flexShrink:0}}>
                            <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
                            <circle cx="7" cy="7" r="5.5" stroke="#080909" strokeWidth="2.5" fill="none" strokeDasharray="22" strokeDashoffset="6"/>
                          </svg>
                          טוען...
                        </> : <>↻ רענן חדשות</>}
                      </button>
                      {updated && !loading && (
                        <span className={`status ${isFallback?"status-warn":"status-ok"}`}>
                          {isFallback ? "⚠ מציג נתונים לדוגמה" : `✓ עודכן ${updated}`}
                        </span>
                      )}
                    </div>
                  </div>

                  {errors.length>0 && !isFallback && (
                    <div className="err-box">
                      ⚠ לא הצלחנו לטעון חלק מהמקורות — מוצגים תוצאות חלקיות:<br/>
                      {errors.map((e,i)=><span key={i} style={{display:"block",opacity:.7,fontSize:12}}>· {e}</span>)}
                    </div>
                  )}

                  {isFallback && (
                    <div className="fallback-banner">
                      ⚠ לא הצלחנו לטעון חדשות כרגע — מוצגות כתבות לדוגמה. לחץ "רענן" לנסות שוב.
                    </div>
                  )}

                  {loading && <Skeleton/>}

                  {news && !loading && (
                    <div className="filters">
                      {FILTER_OPTS.map(f=>(
                        <button key={f} className={`pill${filter===f?" on":""}`} onClick={()=>setFilter(f)}>{f}</button>
                      ))}
                    </div>
                  )}

                  {!loading && shown?.length>0 && (
                    <div className="news-list">
                      {shown.map((item,i)=>(
                        <a key={i} className="news-item" href={item.link} target="_blank" rel="noreferrer">
                          <div className="news-row">
                            <div className="news-body">
                              <div className="news-meta">
                                <span className="src-badge" style={{background:`${item.color}18`,color:item.color,border:`1px solid ${item.color}30`}}>
                                  {item.source}
                                </span>
                                <span className="time">{timeAgo(item.date)}</span>
                                {item.score===3 && <span className="rel-badge rel-3">לונדון</span>}
                                {item.score===2 && <span className="rel-badge rel-2">הפגנה</span>}
                              </div>
                              <div className="news-title">{item.title}</div>
                              {item.desc && <div className="news-desc">{item.desc}{item.desc.length>=200?"…":""}</div>}
                            </div>
                            <div className="news-arrow">←</div>
                          </div>
                        </a>
                      ))}
                    </div>
                  )}

                  {!loading && shown?.length===0 && (
                    <div className="empty">
                      <strong>לא נמצאו כתבות</strong>
                      נסה פילטר אחר או לחץ על "רענן".
                    </div>
                  )}

                  {logs.length>0 && !loading && (
                    <div className="debug">
                      {logs.map((l,i)=><div key={i} className={l.startsWith("✓")?"d-ok":"d-err"}>{l}</div>)}
                    </div>
                  )}
                </>}

                {tab===1 && <>
                  <div className="sec-h"><div className="sec-title">אירועים קרובים</div></div>
                  <div className="ev-card">
                    <div className="ev-tag">// Palestine Solidarity Campaign //</div>
                    <div className="ev-title">PSC — אירועים בלונדון ובבריטניה</div>
                    <div className="ev-desc">PSC הוא הארגון הגדול ביותר לסולידריות עם פלסטין בבריטניה. הם מפרסמים את כל ההפגנות, המצעדים, הוויג'ילים ואירועי הקמפיין בלונדון.</div>
                    <a className="ev-link" href="https://palestinecampaign.org/events/" target="_blank" rel="noreferrer">← פתח: palestinecampaign.org/events</a>
                  </div>
                  <div className="ev-card">
                    <div className="ev-tag">// Stop the War Coalition //</div>
                    <div className="ev-title">STWC — עצרו את המלחמה</div>
                    <div className="ev-desc">ארגון נגד מלחמה המארגן הפגנות ענק בלונדון לעיתים קרובות בשיתוף עם PSC. לוח האירועים שלהם מציג אירועים שלא תמיד מופיעים ב-PSC.</div>
                    <a className="ev-link" href="https://www.stopwar.org.uk/events/" target="_blank" rel="noreferrer">← פתח: stopwar.org.uk/events</a>
                  </div>
                  <div className="ev-card">
                    <div className="ev-tag">// Friends of Al-Aqsa //</div>
                    <div className="ev-title">FOA — חברים של אל-אקצא</div>
                    <div className="ev-desc">ארגון המתמקד בירושלים וזכויות פלסטיניות, מארגן אירועים, לובינג ופעולות ישירות ברחבי בריטניה.</div>
                    <a className="ev-link" href="https://www.foa.org.uk/events" target="_blank" rel="noreferrer">← פתח: foa.org.uk/events</a>
                  </div>
                </>}

                {tab===2 && <>
                  <div className="sec-h">
                    <div className="sec-title">חשבונות אינסטגרם</div>
                    <div className="sec-count">{IG_ACCOUNTS.length} חשבונות</div>
                  </div>
                  <div className="ig-notice">
                    <strong>⚠ בדיקה ידנית בלבד</strong> — Meta חוסמת כל גישה אוטומטית לאינסטגרם.
                    לחץ "פתח" כדי לבדוק כל חשבון. מומלץ לעקוב אחריהם ישירות לעדכונים יומיים.
                  </div>
                  <div className="ig-grid">
                    {IG_ACCOUNTS.map((acc,i)=>(
                      <div key={i} className="ig-card">
                        <div className="ig-row">
                          <div className="ig-av">{acc.handle[0].toUpperCase()}</div>
                          <div>
                            <div className="ig-handle">@{acc.handle}</div>
                            <span className="ig-tag-label">{acc.tag}</span>
                          </div>
                        </div>
                        <div className="ig-desc">{acc.desc}</div>
                        <a className="ig-open" href={acc.url} target="_blank" rel="noreferrer">פתח באינסטגרם ←</a>
                      </div>
                    ))}
                  </div>
                </>}

              </ErrorBoundary>
            </div>

            <div className="footer">
              <div className="footer-logo">מרכז המעקב · לונדון</div>
              <div className="footer-src">Al Jazeera · BBC · Guardian · Independent · Reuters · Middle East Eye</div>
            </div>

          </div>
        </ErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
